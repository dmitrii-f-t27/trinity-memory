name: Ternary Check Live
# Scheduled/manual runs scan public Hub headers and replay pinned readers.
# Pushes rebuild the checker and reuse the last published scan when available.
# Range reads are anonymous and bounded; a prefix may include weight bytes.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ternary-check-live.yml'
      - 'site/live/**'
      - 'native/wasm_formats.c'
      - 'native/compiler.lock'
      - 't27/live.t27'
      - 't27/runtimes.t27'
      - 'tools/build-t27*.sh'
      - 'tools/live-page.py'
      - 'docs/live/findings.md'
      - 'tests/live_formats_wasm.mjs'
      - 'tests/live_wasm_vectors.py'
  pull_request:
    paths:
      - '.github/workflows/ternary-check-live.yml'
      - 'site/live/**'
      - 'native/wasm_formats.c'
      - 'tools/build-t27-wasm.sh'
      - 'tests/live_formats_wasm.mjs'
      - 'tests/live_wasm_vectors.py'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      min_downloads:
        description: 'Scan repositories with at least this many downloads over 30 days'
        default: '100'
      limit:
        description: 'Scan only the N most downloaded repositories (0: all)'
        default: '0'
permissions:
  contents: read
concurrency:
  group: ternary-check-live-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CC: clang
      CXX: clang++
      T27_ROOT: ${{ github.workspace }}/build/compiler
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned compiler and install build tools
        run: |
          git init "$T27_ROOT"
          git -C "$T27_ROOT" remote add origin https://github.com/gHashTag/t27.git
          git -C "$T27_ROOT" fetch --depth 1 origin "$(cat native/compiler.lock)"
          git -C "$T27_ROOT" checkout --detach FETCH_HEAD
          rustup toolchain install 1.94.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y clang lld libssl-dev cmake
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/compiler/target
          key: t27-${{ runner.os }}-${{ runner.arch }}-rust1.94-${{ hashFiles('native/compiler.lock') }}
      - name: Build the t27 library
        run: |
          python3 tools/generate-runtime-tables.py --check
          sh tools/build-t27.sh
      # Headers are cached by their file's LFS SHA-256: a file that did not
      # change since the last run is not read again.
      - uses: actions/cache@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          path: build/live/headers
          key: live-headers-${{ github.run_id }}
          restore-keys: live-headers-
      - name: Build the upstream GGUF readers of the pinned runtimes
        id: readers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: sh tools/live-replay.sh
      - name: Scan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MIN_DOWNLOADS: ${{ inputs.min_downloads || '100' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          set -o pipefail
          mkdir -p build/live
          python3 -m trinity_memory.live --min-downloads "$MIN_DOWNLOADS" --limit "$LIMIT" --interval 1 \
            --out build/live/scan.json 2>&1 | tee build/live/scan.log
      # Every new pin gets seeded synthetic coverage as well as public headers.
      - name: Replay every header through the upstream readers
        if: steps.readers.outcome == 'success'
        run: |
          set -o pipefail
          python3 -m trinity_memory.live --out build/live/scan.json --replay build/replay 2>&1 | tee -a build/live/scan.log
      - name: Differential fuzz of all pinned GGUF readers
        if: steps.readers.outcome == 'success'
        run: |
          set -o pipefail
          # Malformed inputs exercise assertions; do not dump a core per case.
          ulimit -c 0
          python3 tools/live-fuzz.py --out build/live/fuzz.json 2>&1 | tee build/live/fuzz.log
      - name: Summary
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("build/live/scan.json"):
              print("No report."); raise SystemExit
          report = json.load(open("build/live/scan.json"))
          s = report["summary"]
          print("## Ternary Check Live\n")
          print(f"{s['repositories']} repositories ({s['states']}), {s['models']} models in {s['files']} files "
                f"({s['split_models']} split models; not checked: {s['named_models_not_checked']} ternary-named models past "
                f"the limit of 12 per repository and {s['other_models_not_checked']} other models of these repositories), "
                f"{s['downloads_30d_scanned']} downloads over 30 days in the scanned repositories.\n")
          print("| Model verdict | Models |\n|---|---|")
          for verdict, count in s["verdicts"].items():
              print(f"| {verdict} | {count} |")
          print("\n| Runtime | " + " | ".join(sorted({v for r in s['runtimes'].values() for v in r})) + " |")
          keys = sorted({v for r in s['runtimes'].values() for v in r})
          print("|---|" + "---|" * len(keys))
          for runtime, counts in s["runtimes"].items():
              print(f"| {runtime} | " + " | ".join(str(counts.get(k, 0)) for k in keys) + " |")
          replay = report.get("replay")
          if replay:
              missing = sorted(set(report["runtimes"]) - set(replay["runtimes"]))
              if missing:
                  print(f"\n**Not replayed: {', '.join(missing)}** (the reader did not build; see its build log).")
              print(f"\nUpstream readers ({', '.join(replay['runtimes'])}) over {replay['files']} files: "
                    f"{replay['agree']} answers agree with the t27 reader, {replay['disagree']} disagree, "
                    f"{replay['no_verdict']} without a t27 verdict, {replay['crashes']} crashes, "
                    f"{replay['timeouts']} timeouts.")
          else:
              print("\nNo upstream reader was replayed.")
          PY
      - name: Test the browser parser and bounded range requests
        run: node tests/live_formats_wasm.mjs
      - name: Fetch the last published report (for the drift)
        id: previous
        if: github.event_name != 'pull_request'
        env:
          PAGES_URL: https://dmitrii-f-t27.github.io/trinity-memory
        run: |
          mkdir -p reports/live
          code=$(curl -sSL --retry 3 -w '%{http_code}' -o reports/live/scan.json "$PAGES_URL/scan.json")
          case "$code" in
            200) echo 'found=true' >> "$GITHUB_OUTPUT" ;;
            404) printf '%s\n' '{"schema":"trinity.ternary-check-live.v2","repositories":[],"started":"first run"}' > reports/live/scan.json ;;
            *) echo "Previous report could not be read: HTTP $code" >&2; exit 1 ;;
          esac
      - name: Reuse the last published scan on a code push
        if: github.event_name == 'push' && steps.previous.outputs.found == 'true'
        run: |
          mkdir -p build/live
          cp reports/live/scan.json build/live/scan.json
      - name: Render the scan, drift and badges
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.previous.outputs.found == 'true'
        run: |
          python3 tools/live-drift.py reports/live/scan.json build/live/scan.json > build/live/drift.json
          python3 tools/live-page.py page build/live/scan.json --out site/live --drift build/live/drift.json
          mkdir -p site/live/badge
          python3 - <<'PYCODE'
          import json, pathlib, subprocess
          scan = json.load(open("build/live/scan.json"))
          for r in scan["repositories"]:
              result = subprocess.run(["python3", "tools/live-page.py", "badge", "build/live/scan.json", r["repo"]],
                                      capture_output=True, text=True, check=True)
              pathlib.Path(f"site/live/badge/{r['repo'].replace('/', '--')}.json").write_text(result.stdout)
          PYCODE
          cp build/live/scan.json site/live/scan.json
          cp build/live/drift.json site/live/drift.json
      - name: Add the freshly built browser parser
        run: cp build/t27/formats.wasm site/live/formats.wasm
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: site/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ternary-check-live
          retention-days: 7
          path: |
            build/live/scan.json
            build/live/scan.log
            build/live/drift.json
            build/live/fuzz.json
            build/live/fuzz.log
            build/replay/*.log
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
