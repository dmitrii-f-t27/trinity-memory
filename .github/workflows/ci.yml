name: Reference codecs and RTL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_rtl.py --check
      - run: python -m trinity_memory benchmark --count 4096 --repeats 1 --output build/benchmark.json
      - run: python scripts/render_report.py build/benchmark.json --output build/report.html
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-python-${{ matrix.python }}
          path: |
            build/benchmark.json
            build/report.html
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python scripts/test_rtl.py
