name: Memory stack conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate_rtl.py --check
      - run: python -m trinity_memory benchmark --count 4096 --repeats 1 --output build/benchmark.json
      - run: python scripts/render_report.py build/benchmark.json --output build/report.html
      - run: python -m trinity_memory conformance --output build/conformance-report.json
      - run: python -m trinity_memory edge-demo
      - run: python -m pip install --no-deps . --target build/installed
      - name: Check installed package outside the source tree
        run: |
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/build/installed" python -m trinity_memory edge-demo --output "$GITHUB_WORKSPACE/build/installed-edge.json" --html "$GITHUB_WORKSPACE/build/installed-edge.html"
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-python-${{ matrix.python }}
          path: |
            build/benchmark.json
            build/report.html
            build/conformance-report.json
            build/edge-report.json
            build/edge-report.html
            build/installed-edge.json
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python scripts/test_rtl.py
      - run: python scripts/test_dot_rtl.py
      - run: python -m trinity_memory conformance --rtl
      - run: python -m trinity_memory edge-demo --rtl
      - run: python -m pip install --no-deps . --target build/installed-rtl
      - name: Check wheel RTL resources outside the source tree
        run: |
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/build/installed-rtl" python -m trinity_memory edge-demo --rtl --output "$GITHUB_WORKSPACE/build/installed-rtl.json" --html "$GITHUB_WORKSPACE/build/installed-rtl.html"
      - uses: actions/upload-artifact@v4
        with:
          name: stream-compute-evidence
          path: |
            build/conformance-report.json
            build/edge-report.json
            build/edge-report.html
            build/installed-rtl.json
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the explicitly pinned upstream SDK
        run: |
          git clone https://github.com/gHashTag/trinity-sdk.git build/upstream-sdk
          git -C build/upstream-sdk checkout fa8476397ac69438315268342958759e91da9e20
      - run: PYTHONPATH=build/upstream-sdk python scripts/test_sdk_bridge.py
