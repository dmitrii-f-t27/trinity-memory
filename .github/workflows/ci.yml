name: Executable t27 stack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      T27_ROOT: ${{ github.workspace }}/build/compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned compiler and install tools
        run: |
          git init "$T27_ROOT"
          git -C "$T27_ROOT" remote add origin https://github.com/gHashTag/t27.git
          git -C "$T27_ROOT" fetch --depth 1 origin "$(cat native/compiler.lock)"
          git -C "$T27_ROOT" checkout --detach FETCH_HEAD
          rustup toolchain install 1.94.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y iverilog clang libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/compiler/target
          key: t27-ubuntu-rust1.94-${{ hashFiles('native/compiler.lock') }}
      - name: Build the pinned compiler
        run: cd "$T27_ROOT" && cargo +1.94.0 build --locked --release -p t27c --bin t27c --target-dir target
      - name: Specification gate
        run: sh tools/check-specs.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-evidence
          path: build/t27/specs/
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CC: clang
      CXX: clang++
      T27_ROOT: ${{ github.workspace }}/build/compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned compiler and install build tools
        run: |
          git init "$T27_ROOT"
          git -C "$T27_ROOT" remote add origin https://github.com/gHashTag/t27.git
          git -C "$T27_ROOT" fetch --depth 1 origin "$(cat native/compiler.lock)"
          git -C "$T27_ROOT" checkout --detach FETCH_HEAD
          rustup toolchain install 1.94.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y iverilog clang lld libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/compiler/target
          key: t27-ubuntu-rust1.94-${{ hashFiles('native/compiler.lock') }}
      - name: Generate and execute native C, RTL and WASM with differential tests
        run: |
          sh tools/test-t27.sh
          python -m unittest discover -s tests/reference/legacy_tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-t27-evidence
          path: build/t27/
  fixtures:
    # Real-weight byte ranges from Hugging Face, anonymously (no token): a
    # clean clone fetches every range of fixtures/manifest.json, checks HTTP
    # 206, length and sha256, then verifies the cache offline and replays the
    # standard-library BitNet audit against its committed report.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/fixtures
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}
      - name: Fetch every manifest range
        run: python3 tools/fetch-fixtures.py --jobs 4
      - name: Verify the cache offline
        run: python3 tools/fetch-fixtures.py --offline
      - name: Replay the BitNet audit offline
        run: |
          python3 tools/bitnet_audit.py --offline > build/bitnet-audit.json
          cmp build/bitnet-audit.json reports/ternary-check/bitnet-audit-2026-09-23.json
  ternary-check:
    needs: [native, fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRINITY_FIXTURES_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-t27-evidence
          path: build/t27
      - uses: actions/cache/restore@v4
        with:
          path: build/fixtures
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}
          fail-on-cache-miss: true
      - name: Reproduce the committed Ternary Check report from the cached ranges
        run: |
          python3 tools/fetch-fixtures.py --offline
          python3 -m trinity_memory.ternary_check > /dev/null
          python3 - <<'PY'
          import json
          def core(path):
              report = json.load(open(path))
              report.pop("generated")
              for check in report["checks"]:
                  check.pop("seconds")
              return report
          assert core("build/ternary-check.json") == core("reports/ternary-check/2026-09-22.json"), "report differs"
          print("build/ternary-check.json matches reports/ternary-check/2026-09-22.json")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ternary-check
          path: build/ternary-check.json
  python:
    needs: native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: native-t27-evidence
          path: build/t27
      - name: Restore executable mode and install simulator
        run: |
          chmod +x build/t27/trinity-memory-t27
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Exercise public native Python adapters
        run: python -m unittest discover -s tests -v
      - run: python -m trinity_memory benchmark --count 4096 --repeats 1 --output build/benchmark.json
      - run: python scripts/render_report.py build/benchmark.json --output build/report.html
      - run: python -m trinity_memory conformance --rtl --output build/conformance-report.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conformance lab, two identical runs
        run: python tools/conformance-lab.py --repeat 2 --output build/conformance-lab.json
      - run: python -m trinity_memory edge-demo --rtl
      - name: Build and install platform wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir build/wheels
          python -m pip install --no-deps build/wheels/*.whl --target build/installed
          python tests/native/test_installed_wheel.py --wheel build/wheels/*.whl --rtl --output build/installed-wheel.json
      - name: Exercise installed package outside the checkout
        run: |
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/build/installed" python -m trinity_memory edge-demo --rtl --output "$GITHUB_WORKSPACE/build/installed-edge.json" --html "$GITHUB_WORKSPACE/build/installed-edge.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-python-${{ matrix.python }}
          path: |
            build/*.json
            build/*.html
            build/wheels/
  sdk:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-t27-evidence
          path: build/t27
      - name: Fetch the explicitly pinned upstream SDK
        run: |
          git clone https://github.com/gHashTag/trinity-sdk.git build/upstream-sdk
          git -C build/upstream-sdk checkout fa8476397ac69438315268342958759e91da9e20
      - run: PYTHONPATH=build/upstream-sdk python scripts/test_sdk_bridge.py
