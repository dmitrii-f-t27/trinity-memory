name: GF16 full FFN
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 't27/rtl/gf16_ffn.t27'
      - 'rtl/t27/gf16_ffn.v'
      - 'tools/gf16_ffn_*.py'
      - 'tools/replay_gf16_ffn.py'
      - 'tools/measure_gf16_ffn.py'
      - 'tools/verify_gf16_ffn_board.py'
      - 'tools/fpga-ffn.py'
      - 'tests/test_gf16_ffn.py'
      - 'tests/tb_gf16_ffn.v'
      - 'tests/test_gf16_scalar.py'
      - 'tests/test_ffn_capture.py'
      - 'tests/test_ffn_boot.py'
      - 'tools/fpga-ffn-run.py'
      - 'tools/fpga-matvec-boot.py'
      - 't27/rtl/gf16_wide_norm.t27'
      - 't27/rtl/gf16_scalar.t27'
      - 't27/rtl/ffn_wide.t27'
      - 'rtl/t27/gf16_wide_norm.v'
      - 'tools/gf16_wide_*.py'
      - 'tools/replay_gf16_wide.py'
      - 'tests/test_gf16_wide.py'
      - 'tools/capture_bitnet_layer0.py'
      - 'tools/bitnet_ffn_runtime.py'
      - 'tools/bitnet-capture-requirements.txt'
      - 'fixtures/bitnet-layer0-capture.json'
      - 'reports/fpga/gf16-ffn-2026-10-01-24917fa7/**'
      - 'reports/numeric/gf16-ffn.json'
      - 'native/compiler.lock'
      - '.github/workflows/gf16-ffn.yml'
permissions:
  contents: read
jobs:
  full-ffn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: clang
      CXX: clang++
      T27_ROOT: ${{ github.workspace }}/build/compiler
      TORCH_COMPILE_DISABLE: '1'
      TRINITY_REQUIRE_CAPTURE_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/bitnet-capture-requirements.txt
      - name: Fetch pinned compiler and tools
        run: |
          git init "$T27_ROOT"
          git -C "$T27_ROOT" remote add origin https://github.com/gHashTag/t27.git
          git -C "$T27_ROOT" fetch --depth 1 origin "$(cat native/compiler.lock)"
          git -C "$T27_ROOT" checkout --detach FETCH_HEAD
          rustup toolchain install 1.94.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys clang lld libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/compiler/target
          key: t27-ubuntu-rust1.94-${{ hashFiles('native/compiler.lock') }}
      - name: Build pinned compiler and optional capture runtime
        run: |
          (cd "$T27_ROOT" && cargo +1.94.0 build --locked --release -p t27c --bin t27c --target-dir target)
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/bitnet-capture-requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            build/bitnet-capture/metadata
            build/bitnet-capture/ranges
            ~/.cache/huggingface/hub
          key: bitnet-capture-${{ hashFiles('fixtures/bitnet-layer0-capture.json') }}
      - uses: actions/cache@v4
        with:
          path: build/fixtures
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}
      - name: Build the native fixture decoder and verify pinned fixture ranges
        run: |
          sh tools/build-t27.sh
          python tools/fetch-fixtures.py --jobs 4
      - name: Arithmetic, bounds, rounding, sanitizers and RTL protocol
        run: python -m unittest tests.test_gf16_scalar tests.test_gf16_ffn tests.test_bitnet_runtime tests.test_ffn_boot tests.test_ffn_capture -v
      - name: Recheck committed physical board captures
        run: python reports/fpga/gf16-ffn-2026-10-01-24917fa7/verify-captures.py
      - name: Capture and require exact BF16 calibration
        run: python tools/capture_bitnet_layer0.py --fetch --output build/bitnet-capture/linux-report.json
      - name: Compare all 45 rows and replay five complete FFNs through RTL
        run: >-
          python tools/replay_gf16_ffn.py --rtl selected
          --capture-report build/bitnet-capture/linux-report.json
          --output build/gf16-ffn/linux-report.json
      - name: Measure full and result-only clocks on the same BOS input
        run: >-
          python tools/measure_gf16_ffn.py
          --vectors build/gf16-ffn/replay/prompt-0-token-0
          --output build/gf16-ffn/performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gf16-full-ffn
          path: |
            build/gf16-ffn/linux-report.json
            build/gf16-ffn/performance/result.json
            build/gf16-ffn/performance/*/capture.txt
            build/gf16-ffn/performance/*/simulation.log
            build/gf16-ffn/replay/prompt-*/capture.txt
            build/gf16-ffn/replay/prompt-*/rtl.log
            build/bitnet-capture/linux-report.json
