[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-ternary-memory"
version = "0.2.0"
description = "Ternary memory stack: TensorPack, Bridge, stream compute, conformance and edge demonstration"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.urls]
Repository = "https://github.com/dmitrii-f-t27/trinity-memory"
Issues = "https://github.com/dmitrii-f-t27/trinity-memory/issues"

[project.scripts]
trinity-memory = "trinity_memory.cli:main"

[tool.setuptools]
packages = ["trinity_memory"]
