[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-ternary-memory"
version = "0.1.0"
description = "Reproducible ternary storage codecs and FPGA decoder experiments"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
trinity-memory = "trinity_memory.cli:main"

[tool.setuptools]
packages = ["trinity_memory"]
